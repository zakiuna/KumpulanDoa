<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kumpulan Do'a Berbagai Acara</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b1a2a;
            color: #eef5ff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 80px;
            min-height: 100vh;
            background: rgba(10, 25, 40, 0.55);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(255, 215, 120, 0.3);
            margin-bottom: 16px;
        }

        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd966, #f0b429);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .app-header .badge {
            background: rgba(255, 215, 120, 0.15);
            border: 1px solid rgba(255, 215, 120, 0.4);
            color: #ffd966;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* Admin action buttons */
        .admin-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-admin {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 120, 0.3);
            background: rgba(255, 215, 120, 0.08);
            color: #ffd966;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .btn-admin:active {
            transform: scale(0.97);
        }

        .btn-admin.primary {
            background: linear-gradient(135deg, #ffd966, #f0b429);
            color: #0b1a2a;
            border-color: #ffd966;
        }

        .btn-admin.danger {
            background: rgba(255, 80, 80, 0.12);
            border-color: rgba(255, 80, 80, 0.4);
            color: #ff8080;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 120, 0.3);
            background: rgba(255, 255, 255, 0.07);
            color: #eef5ff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .search-wrapper input:focus {
            border-color: #ffd966;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(255, 215, 120, 0.15);
        }

        .search-wrapper input::placeholder {
            color: rgba(238, 245, 255, 0.5);
        }

        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffd966;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* Category Chips */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 120, 0.2);
            color: rgba(238, 245, 255, 0.8);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        .category-chip.active {
            background: linear-gradient(135deg, #ffd966, #f0b429);
            color: #0b1a2a;
            border-color: #ffd966;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 215, 120, 0.3);
        }

        /* Prayer List */
        .prayer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .prayer-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 120, 0.15);
            border-radius: 16px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
        }

        .prayer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #ffd966, #f0b429);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .prayer-card:active::before {
            opacity: 1;
        }

        .prayer-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.09);
        }

        .prayer-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .prayer-card .card-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #eef5ff;
            line-height: 1.4;
            flex: 1;
        }

        .prayer-card .card-category {
            font-size: 0.65rem;
            color: #ffd966;
            background: rgba(255, 215, 120, 0.12);
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 500;
            border: 1px solid rgba(255, 215, 120, 0.2);
        }

        .prayer-card .card-preview {
            font-family: 'Amiri', serif;
            font-size: 1.05rem;
            color: rgba(238, 245, 255, 0.55);
            margin-top: 8px;
            line-height: 1.8;
            direction: rtl;
            text-align: right;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 12, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(180deg, #112233, #0b1a2a);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border-top: 1px solid rgba(255, 215, 120, 0.3);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 215, 120, 0.4);
            border-radius: 2px;
            margin: 0 auto 18px;
        }

        .modal-content .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffd966;
            margin-bottom: 6px;
            line-height: 1.4;
            padding-right: 40px;
        }

        .modal-content .modal-category {
            font-size: 0.75rem;
            color: rgba(255, 215, 120, 0.7);
            margin-bottom: 18px;
            display: inline-block;
            background: rgba(255, 215, 120, 0.1);
            padding: 3px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 120, 0.2);
        }

        /* FONT ARAB - Amiri */
        .modal-content .modal-arabic {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.6;
            text-align: right;
            direction: rtl;
            color: #ffffff;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border-right: 3px solid #ffd966;
            word-spacing: 4px;
            white-space: pre-wrap;
        }

        .modal-content .modal-source {
            font-size: 0.75rem;
            color: rgba(238, 245, 255, 0.5);
            padding-top: 12px;
            border-top: 1px solid rgba(255, 215, 120, 0.15);
            text-align: center;
        }

        .modal-content .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 120, 0.2);
            color: #eef5ff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-content .close-btn:active {
            background: rgba(255, 215, 120, 0.2);
            transform: scale(0.9);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 215, 120, 0.15);
        }

        /* Form fields */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #ffd966;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 120, 0.25);
            background: rgba(255, 255, 255, 0.05);
            color: #eef5ff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ffd966;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(255, 215, 120, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            line-height: 1.5;
        }

        .form-group textarea.arabic-input {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            direction: rtl;
            text-align: right;
            line-height: 2.2;
            min-height: 180px;
        }

        /* PIN Modal */
        .pin-modal .modal-content {
            max-width: 360px;
            border-radius: 24px;
            margin-bottom: 20vh;
            padding: 28px 24px;
        }

        .pin-modal {
            align-items: center;
        }

        .pin-modal .modal-content {
            transform: translateY(30px) scale(0.95);
        }

        .pin-modal.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .pin-icon {
            text-align: center;
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        .pin-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffd966;
            margin-bottom: 6px;
        }

        .pin-desc {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(238, 245, 255, 0.6);
            margin-bottom: 20px;
        }

        .pin-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 120, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: #ffd966;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .pin-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 120, 0.2);
        }

        .pin-error {
            color: #ff8080;
            font-size: 0.78rem;
            text-align: center;
            margin-bottom: 10px;
            min-height: 18px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(238, 245, 255, 0.4);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        .app-footer {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: rgba(238, 245, 255, 0.3);
            border-top: 1px solid rgba(255, 215, 120, 0.08);
            margin-top: 20px;
        }

        .modal-content::-webkit-scrollbar {
            width: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 120, 0.3);
            border-radius: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #ffd966, #f0b429);
            color: #0b1a2a;
            padding: 12px 22px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: linear-gradient(135deg, #ff8080, #e05555);
            color: #fff;
        }

        @media (max-width: 380px) {
            .app-header h1 { font-size: 1.1rem; }
            .modal-content .modal-arabic { font-size: 1.5rem; line-height: 2.3; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <header class="app-header">
            <h1>📖 Kumpulan Do'a</h1>
            <span class="badge" id="adminBadge">Publik</span>
        </header>

        <!-- Admin Bar -->
        <div class="admin-bar" id="adminBar">
            <button class="btn-admin" id="loginBtn">🔒 Login</button>
            <button class="btn-admin primary" id="addBtn" style="display:none;">➕ Tambah Do'a</button>
            <button class="btn-admin danger" id="logoutBtn" style="display:none;">🚪 Logout</button>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Cari do'a atau acara..." autocomplete="off">
        </div>

        <div class="category-scroll" id="categoryScroll"></div>

        <div class="prayer-list" id="prayerList"></div>

        <footer class="app-footer">
            &copy; 2025 Kumpulan Do'a Berbagai Acara
        </footer>
    </div>

    <!-- Modal Detail Do'a -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">✕</button>
            <div class="modal-handle"></div>
            <h2 class="modal-title" id="modalTitle">-</h2>
            <span class="modal-category" id="modalCategory">-</span>
            <div class="modal-arabic" id="modalArabic">-</div>
            <div class="modal-source" id="modalSource">-</div>
            <div class="modal-actions" id="modalActions" style="display:none;">
                <button class="btn-admin primary" id="editPrayerBtn" style="flex:1;">✏️ Edit</button>
                <button class="btn-admin danger" id="deletePrayerBtn" style="flex:1;">🗑️ Hapus</button>
            </div>
        </div>
    </div>

    <!-- Modal Form Tambah/Edit -->
    <div class="modal-overlay" id="formOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeForm">✕</button>
            <div class="modal-handle"></div>
            <h2 class="modal-title" id="formTitle">Tambah Do'a Baru</h2>

            <div class="form-group">
                <label>Judul Do'a</label>
                <input type="text" id="fTitle" placeholder="Contoh: Doa Acara Tasyakuran">
            </div>

            <div class="form-group">
                <label>Kategori</label>
                <input type="text" id="fCategory" list="categoryList" placeholder="Contoh: Tasyakuran / Pernikahan">
                <datalist id="categoryList"></datalist>
            </div>

            <div class="form-group">
                <label>Teks Arab (Lengkap)</label>
                <textarea id="fArabic" class="arabic-input" placeholder="اكتب النص العربي هنا..." dir="rtl"></textarea>
            </div>

            <div class="form-group">
                <label>Sumber</label>
                <input type="text" id="fSource" placeholder="Contoh: HR. Bukhari & Muslim">
            </div>

            <div class="modal-actions">
                <button class="btn-admin" id="cancelForm" style="flex:1;">Batal</button>
                <button class="btn-admin primary" id="saveForm" style="flex:1;">💾 Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal PIN Login -->
    <div class="modal-overlay pin-modal" id="pinOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closePin">✕</button>
            <div class="pin-icon">🔐</div>
            <div class="pin-title">Login Admin</div>
            <div class="pin-desc">Masukkan PIN untuk mengelola do'a</div>
            <input type="password" class="pin-input" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••••" autocomplete="off">
            <div class="pin-error" id="pinError"></div>
            <button class="btn-admin primary" id="submitPin" style="width:100%;">Masuk</button>
            <p style="font-size:0.68rem;color:rgba(238,245,255,0.4);margin-top:14px;text-align:center;">PIN default: <strong style="color:#ffd966;">123456</strong></p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================
        const ADMIN_PIN = '123456';
        const STORAGE_KEY = 'kumpulan_doa_data_v2';
        const SESSION_KEY = 'kumpulan_doa_admin';

        // ============================================================
        // DATA DO'A LENGKAP (Arab only)
        // ============================================================
        const defaultPrayers = [
            {
                id: 1,
                title: "Bacaan Pembukaan Segala Acara",
                category: "Pembukaan",
                arabic: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، حَمْدًا يُوَافِي نِعَمَهُ وَيُكَافِئُ مَزِيدَهُ، يَا رَبَّنَا لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ الْكَرِيمِ وَعَظِيمِ سُلْطَانِكَ.\n\nاللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، صَلَاةً تُنْجِينَا بِهَا مِنْ جَمِيعِ الْأَهْوَالِ وَالْآفَاتِ، وَتَقْضِي لَنَا بِهَا جَمِيعَ الْحَاجَاتِ، وَتُطَهِّرُنَا بِهَا مِنْ جَمِيعِ السَّيِّئَاتِ، وَتَرْفَعُنَا بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ، وَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ، مِنْ جَمِيعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ.\n\nأَمَّا بَعْدُ، فَإِنَّ أَصْدَقَ الْحَدِيثِ كِتَابُ اللَّهِ، وَخَيْرَ الْهَدْيِ هَدْيُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَشَرَّ الْأُمُورِ مُحْدَثَاتُهَا، وَكُلَّ مُحْدَثَةٍ بِدْعَةٌ، وَكُلَّ بِدْعَةٍ ضَلَالَةٌ، وَكُلَّ ضَلَالَةٍ فِي النَّارِ.",
                source: "HR. Abu Dawud & Tirmidzi"
            },
            {
                id: 2,
                title: "Mukadimah Taklim atau Pengajian",
                category: "Pembukaan",
                arabic: "إِنَّ الْحَمْدَ لِلَّهِ نَحْمَدُهُ وَنَسْتَعِينُهُ وَنَسْتَغْفِرُهُ وَنَعُوذُ بِاللَّهِ مِنْ شُرُورِ أَنْفُسِنَا وَمِنْ سَيِّئَاتِ أَعْمَالِنَا، مَنْ يَهْدِهِ اللَّهُ فَلَا مُضِلَّ لَهُ، وَمَنْ يُضْلِلْ فَلَا هَادِيَ لَهُ.\n\nوَأَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.\n\nيَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ.\n\nيَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاءً ۚ وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ ۚ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا.\n\nيَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا، يُصْلِحْ لَكُمْ أَعْمَالَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ فَقَدْ فَازَ فَوْزًا عَظِيمًا.\n\nأَمَّا بَعْدُ.",

            {

                category: "Tasyakuran",

                arabic: "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ.\n\nاللَّهُمَّ هَذَا مِنْكَ وَلَكَ، تَقَبَّلْ مِنِّي كَمَا تَقَبَّلْتَ مِنْ إِبْرَاهِيمَ خَلِيلِكَ، وَمِنْ مُحَمَّدٍ حَبِيبِكَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.\n\nاللَّهُمَّ تَقَبَّلْ مِنَّا هَذَا الْقُرْبَانَ، وَاجْعَلْهُ خَالِصًا لِوَجْهِكَ الْكَرِيمِ، وَسَبَبًا لِقُرْبِنَا مِنْكَ يَوْمَ الْقِيَامَةِ.\n\nاللَّهُمَّ اجْعَلْهُ فِدَاءً لَنَا مِنَ النَّارِ، وَشَفَاعَةً لَنَا عِنْدَكَ، وَبَرَكَةً فِي أَمْوَالِنَا وَأَنْفُسِنَا وَأَوْلَادِنَا.\n\nاللَّهُمَّ تَقَبَّلْ مِنَّا وَمِنْ وَالِدِينَا وَمِنْ جَمِيعِ الْمُسْلِمِينَ.",

                title: "Doa Khotbah Shalat Gerhana Bulan",

                arabic: "إِنَّ الشَّمْسَ وَالْقَمَرَ آيَتَانِ مِنْ آيَاتِ اللَّهِ، لَا يَخْسِفَانِ لِمَوْتِ أَحَدٍ وَلَا لِحَيَاتِهِ، فَإِذَا رَأَيْتُمْ ذَلِكَ فَاذْكُرُوا اللَّهَ، وَكَبِّرُوا، وَصَلُّوا، وَتَصَدَّقُوا.\n\nاللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ شُرُورِ أَعْمَالِنَا، وَمِنْ سَيِّئَاتِ أَنْفُسِنَا.\n\nاللَّهُمَّ اغْفِرْ لَنَا وَلِوَالِدِينَا، وَتَقَبَّلْ صَالِحَ أَعْمَالِنَا، وَاشْرَحْ صُدُورَنَا لِذِكْرِكَ.\n\nاللَّهُمَّ أَعِذْنَا مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ النَّارِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ.\n\nاللَّهُمَّ آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.",
                source: "HR. Bukhari & Muslim, QS. Al-Baqarah: 201"
            },
            {
                id: 14,
                title: "Doa Khotbah Shalat Gerhana Matahari",
                category: "Gerhana",
                arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.\n\nاللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، وَاحْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.\n\nاللَّهُمَّ اغْفِرْ لِي ذَنْبِي، وَاجْلُ قَلْبِي، وَحَصِّنْ فَرْجِي.\n\nاللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ فِتْنَةِ الْقَبْرِ، وَمِنْ شَرِّ فِتْنَةِ الْغِنَى، وَمِنْ شَرِّ فِتْنَةِ الْفَقْرِ.",
                source: "HR. Abu Dawud, HR. Muslim"
            },
            {
                id: 15,
                title: "Doa Qunut Subuh",
                category: "Shalat",
                arabic: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، وَلَا يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ.\n\nفَلَكَ الْحَمْدُ عَلَى مَا قَضَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.\n\nوَصَلَّى اللَّهُ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ.",
                source: "HR. Tirmidzi, HR. An-Nasa'i"
            },
            {
                id: 16,
                title: "Doa dalam Acara Keislaman Seseorang",
                category: "Keislaman",
                arabic: "اللَّهُمَّ ثَبِّتْ قَلْبَهُ عَلَى دِينِكَ، وَاجْعَلْهُ مِنَ الْمُهْتَدِينَ.\n\nاللَّهُمَّ اجْعَلِ الْإِيمَانَ عَزِيزًا فِي قَلْبِهِ، وَحَبِّبْ إِلَيْهِ الْإِيمَانَ وَزَيِّنْهُ فِي قَلْبِهِ.\n\nاللَّهُمَّ بَغِّضْ إِلَيْهِ الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ، وَاجْعَلْهُ مِنَ الرَّاشِدِينَ.\n\nاللَّهُمَّ اجْعَلْهُ مِنْ عِبَادِكَ الصَّالِحِينَ، وَمِنَ الْمُقَرَّبِينَ، وَمِنْ أَهْلِ طَاعَتِكَ.\n\nاللَّهُمَّ بَارِكْ لَهُ فِي حَيَاتِهِ، وَاجْعَلْ خَاتِمَتَهُ حُسْنَ الْخَاتِمَةِ.\n\nرَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.",
                source: "Doa Keislaman, QS. Ali Imran: 8"
            },
            {
                id: 17,
                title: "Doa Qunut Nazilah",
                category: "Shalat",
                arabic: "اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُثْنِي عَلَيْكَ وَلَا نَكْفُرُكَ، وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ.\n\nاللَّهُمَّ إِيَّاكَ نَعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَلَكَ نَسْعَى وَنَحْفِدُ، وَنَرْجُو رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ.\n\nاللَّهُمَّ عَذِّبِ الْكَفَرَةَ وَالْمُشْرِكِينَ الَّذِينَ يَصُدُّونَ عَنْ سَبِيلِكَ، وَيُكَذِّبُونَ رُسُلَكَ، وَيُقَاتِلُونَ أَوْلِيَاءَكَ.\n\nاللَّهُمَّ خَالِفْ بَيْنَ كَلِمَاتِهِمْ، وَزَلْزِلْ أَقْدَامَهُمْ، وَأَنْزِلْ بِهِمْ بَأْسَكَ الَّذِي لَا تُرَدُّ عَنِ الْقَوْمِ الْمُجْرِمِينَ.\n\nاللَّهُمَّ أَنْجِ الْمُسْتَضْعَفِينَ مِنَ الْمُؤْمِنِينَ، وَارْفَعْ عَنْهُمْ، وَاشْفِ مَرْضَاهُمْ، وَارْحَمْ مَوْتَاهُمْ.",
                source: "HR. Bukhari, HR. Tirmidzi"
            },
            {

                category: "Haji",
                arabic: "اللَّهُمَّ احْفَظْهُمْ فِي سَفَرِهِمْ، وَأَعِنْهُمْ عَلَى أَدَاءِ مَنَاسِكِهِمْ، وَتَقَبَّلْ مِنْهُمْ.\n\nاللَّهُمَّ يَسِّرْ لَهُمْ كُلَّ عَسِيرٍ، وَسَهِّلْ لَهُمْ كُلَّ صَعْبٍ، وَوَفِّقْهُمْ لِمَا تُحِبُّ وَتَرْضَى.\n\nاللَّهُمَّ اجْعَلْ حَجَّهُمْ حَجًّا مَبْرُورًا، وَسَعْيَهُمْ سَعْيًا مَشْكُورًا، وَذَنْبَهُمْ ذَنْبًا مَغْفُورًا.\n\nاللَّهُمَّ ارْزُقْهُمْ صِحَّةً فِي الْبَدَنِ، وَسَلَامَةً فِي الْفِكْرِ، وَطُمَأْنِينَةً فِي الْقَلْبِ.\n\nاللَّهُمَّ رُدَّهُمْ إِلَى أَهْلِيهِمْ سَالِمِينَ غَانِمِينَ، وَاجْعَلْهُمْ مِنَ الْحَاجِّينَ الْمَقْبُولِينَ.\n\nاللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
                source: "Doa Safar, HR. Abu Dawud"
            },
            {

                category: "Haji",
                arabic: "الْحَمْدُ لِلَّهِ الَّذِي رَدَّكَ إِلَى أَهْلِكَ سَالِمًا غَانِمًا، تَقَبَّلَ اللَّهُ حَجَّكَ وَسَعْيَكَ، وَغَفَرَ ذَنْبَكَ.\n\nاللَّهُمَّ اجْعَلْ حَجَّهُ حَجًّا مَبْرُورًا، وَسَعْيَهُ سَعْيًا مَشْكُورًا، وَذَنْبَهُ ذَنْبًا مَغْفُورًا.\n\nاللَّهُمَّ اجْعَلْهُ مِنْ عِبَادِكَ الصَّالِحِينَ، وَمِنَ الْمُتَقِينَ، وَمِنَ الْحَاجِّينَ الْمَقْبُولِينَ.\n\nاللَّهُمَّ بَارِكْ لَهُ فِي حَيَاتِهِ، وَاجْعَلْ خَاتِمَتَهُ حُسْنَ الْخَاتِمَةِ.\n\nاللَّهُمَّ ارْزُقْنَا حَجَّ بَيْتِكَ الْحَرَامِ، وَزِيَارَةَ مَسْجِدِ نَبِيِّكَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.",

            {
                id: 20,
                title: "Doa Setelah Shalat Istisqa",
                category: "Shalat",
                arabic: "اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا.\n\nاللَّهُمَّ اسْقِنَا غَيْثًا مُغِيثًا، مَرِيئًا مَرِيعًا، نَافِعًا غَيْرَ ضَارٍّ، عَاجِلًا غَيْرَ آجِلٍ.\n\nاللَّهُمَّ اسْقِنَا الْغَيْثَ وَلَا تَجْعَلْنَا مِنَ الْقَانِطِينَ، وَاجْعَلْ فِينَا مِنَ الشَّاكِرِينَ.\n\nاللَّهُمَّ أَنْزِلْ عَلَيْنَا مِنْ بَرَكَاتِ السَّمَاءِ، وَأَخْرِجْ لَنَا مِنْ بَرَكَاتِ الْأَرْضِ.\n\nاللَّهُمَّ اجْعَلْ هَذَا الْغَيْثَ غَيْثَ خَيْرٍ وَبَرَكَةٍ، وَسَبَبًا لِخِصْبِ الْبِلَادِ وَرَخَاءِ الْعِبَادِ.",
                source: "HR. Bukhari & Muslim, HR. Abu Dawud"
            },
            {
                id: 21,
                title: "Doa Istighatsah",
                category: "Shalat",
                arabic: "اللَّهُمَّ إِنَّا نَسْأَلُكَ بِأَنَّكَ أَنْتَ اللَّهُ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.\n\nاللَّهُمَّ إِنَّا نَسْأَلُكَ بِأَنَّكَ أَنْتَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ.\n\nاللَّهُمَّ إِنَّا نَسْأَلُكَ بِأَنَّكَ أَنْتَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ.\n\nاللَّهُمَّ إِنَّا نَسْأَلُكَ بِأَنَّكَ أَنْتَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ لَهُ الْأَسْمَاءُ الْحُسْنَى.\n\nاللَّهُمَّ إِنَّا نَسْأَلُكَ بِكُلِّ اسْمٍ سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ.\n\nاللَّهُمَّ اجْعَلْ لَنَا مِنْ كُلِّ هَمٍّ فَرَجًا، وَمِنْ كُلِّ ضِيقٍ مَخْرَجًا، وَمِنْ كُلِّ بَلَاءٍ عَافِيَةً.",

                arabic: "اللَّهُمَّ احْفَظْ وَلَدِي مَا دَامَ فِي بَطْنِي، وَاشْفِهِ وَعَافِهِ، وَأَخْرِجْهُ إِلَى الدُّنْيَا سَالِمًا.\n\nاللَّهُمَّ اجْعَلْهُ مِنَ الصَّالِحِينَ، وَمِنْ حَمَلَةِ كِتَابِكَ، وَمِنْ أَهْلِ طَاعَتِكَ.\n\nاللَّهُمَّ سَهِّلْ لِي حَمْلَهُ وَوِلَادَتَهُ، وَاجْعَلْهُ قُرَّةَ عَيْنٍ لِي وَلِوَالِدِهِ.\n\nاللَّهُمَّ ارْزُقْنِي صِحَّةً وَعَافِيَةً، وَقُوَّةً فِي الْبَدَنِ، وَطُمَأْنِينَةً فِي الْقَلْبِ.\n\nاللَّهُمَّ اجْعَلْهُ ذُرِّيَّةً طَيِّبَةً، وَبَارِكْ لِي فِيهِ.\n\nرَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا.",

            {

        // ============================================================
        // STATE
        // ============================================================
        let prayersData = [];
        let currentCategory = 'Semua';
        let searchQuery = '';
        let isAdmin = false;
        let editingId = null;
        let currentDetailId = null;

        // ============================================================
        // STORAGE
        // ============================================================
        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        prayersData = parsed;
                        return;
                    }
                }
                prayersData = [...defaultPrayers];
                saveData();
            } catch (e) {
                prayersData = [...defaultPrayers];
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(prayersData));
            } catch (e) {
                showToast('Gagal menyimpan data', true);
            }
        }

        function getNextId() {
            return prayersData.length > 0 ? Math.max(...prayersData.map(p => p.id)) + 1 : 1;
        }

        // ============================================================
        // DOM REFS
        // ============================================================
        const categoryScroll = document.getElementById('categoryScroll');
        const prayerList = document.getElementById('prayerList');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const formOverlay = document.getElementById('formOverlay');
        const pinOverlay = document.getElementById('pinOverlay');
        const adminBadge = document.getElementById('adminBadge');

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer;
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.className = 'toast';
            }, 2200);
        }

        // ============================================================
        // AUTH
        // ============================================================
        function checkSession() {
            isAdmin = sessionStorage.getItem(SESSION_KEY) === 'true';
            updateAdminUI();
        }

        function setSession(val) {
            if (val) {
                sessionStorage.setItem(SESSION_KEY, 'true');
            } else {
                sessionStorage.removeItem(SESSION_KEY);
            }
            isAdmin = val;
            updateAdminUI();
        }

        function updateAdminUI() {
            const loginBtn = document.getElementById('loginBtn');
            const addBtn = document.getElementById('addBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            if (isAdmin) {
                loginBtn.style.display = 'none';
                addBtn.style.display = 'flex';
                logoutBtn.style.display = 'flex';
                adminBadge.textContent = 'Admin';
            } else {
                loginBtn.style.display = 'flex';
                addBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
                adminBadge.textContent = 'Publik';
            }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function getCategories() {
            return ['Semua', ...new Set(prayersData.map(p => p.category))];
        }

        function renderCategories() {
            const categories = getCategories();
            categoryScroll.innerHTML = categories.map(cat => `
                <div class="category-chip ${cat === currentCategory ? 'active' : ''}" data-category="${cat}">
                    ${cat}
                </div>
            `).join('');

            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    currentCategory = chip.dataset.category;
                    renderCategories();
                    renderPrayers();
                });
            });

            const datalist = document.getElementById('categoryList');
            datalist.innerHTML = categories.filter(c => c !== 'Semua').map(c => `<option value="${c}">`).join('');
        }

        function getFilteredPrayers() {
            return prayersData.filter(prayer => {
                const matchCategory = currentCategory === 'Semua' || prayer.category === currentCategory;
                const q = searchQuery.toLowerCase();
                const matchSearch = searchQuery === '' ||
                    prayer.title.toLowerCase().includes(q) ||
                    prayer.category.toLowerCase().includes(q);
                return matchCategory && matchSearch;
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function renderPrayers() {
            const filtered = getFilteredPrayers();

            if (filtered.length === 0) {
                prayerList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>Do'a tidak ditemukan</p>
                    </div>
                `;
                return;
            }

            prayerList.innerHTML = filtered.map(prayer => {
                // Preview arab (hapus newline, ambil 60 karakter pertama)
                const arabicPreview = (prayer.arabic || '').replace(/\n/g, ' ').substring(0, 80);
                return `
                <div class="prayer-card" data-id="${prayer.id}">
                    <div class="card-header">
                        <span class="card-title">${escapeHtml(prayer.title)}</span>
                        <span class="card-category">${escapeHtml(prayer.category)}</span>
                    </div>
                    <div class="card-preview">${escapeHtml(arabicPreview)}${(prayer.arabic || '').length > 80 ? '...' : ''}</div>
                </div>
            `;
            }).join('');

            document.querySelectorAll('.prayer-card').forEach(card => {
                card.addEventListener('click', () => {
                    showPrayerDetail(parseInt(card.dataset.id));
                });
            });
        }

        // ============================================================
        // DETAIL MODAL
        // ============================================================
        function showPrayerDetail(id) {
            const prayer = prayersData.find(p => p.id === id);
            if (!prayer) return;

            currentDetailId = id;
            document.getElementById('modalTitle').textContent = prayer.title;
            document.getElementById('modalCategory').textContent = prayer.category;
            document.getElementById('modalArabic').textContent = prayer.arabic;
            document.getElementById('modalSource').textContent = prayer.source ? `Sumber: ${prayer.source}` : '';
            document.getElementById('modalSource').style.display = prayer.source ? 'block' : 'none';

            document.getElementById('modalActions').style.display = isAdmin ? 'flex' : 'none';

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModalFunc() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // FORM MODAL
        // ============================================================
        function openForm(prayer = null) {
            editingId = prayer ? prayer.id : null;
            document.getElementById('formTitle').textContent = prayer ? 'Edit Do\'a' : 'Tambah Do\'a Baru';
            document.getElementById('fTitle').value = prayer ? prayer.title : '';
            document.getElementById('fCategory').value = prayer ? prayer.category : '';
            document.getElementById('fArabic').value = prayer ? prayer.arabic : '';
            document.getElementById('fSource').value = prayer ? (prayer.source || '') : '';

            formOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeForm() {
            formOverlay.classList.remove('active');
            document.body.style.overflow = '';
            editingId = null;
        }

        function saveForm() {
            const title = document.getElementById('fTitle').value.trim();
            const category = document.getElementById('fCategory').value.trim();
            const arabic = document.getElementById('fArabic').value.trim();
            const source = document.getElementById('fSource').value.trim();

            if (!title || !category || !arabic) {
                showToast('Judul, kategori, dan teks arab wajib diisi', true);
                return;
            }

            if (editingId) {
                const idx = prayersData.findIndex(p => p.id === editingId);
                if (idx !== -1) {
                    prayersData[idx] = { id: editingId, title, category, arabic, source };
                }
                showToast('Do\'a berhasil diperbarui ✓');
            } else {
                prayersData.push({
                    id: getNextId(),
                    title, category, arabic, source
                });
                showToast('Do\'a berhasil ditambahkan ✓');
            }

            saveData();
            closeForm();
            renderCategories();
            renderPrayers();

            if (modalOverlay.classList.contains('active') && editingId) {
                showPrayerDetail(editingId);
            }
        }

        // ============================================================
        // PIN MODAL
        // ============================================================
        function openPin() {
            document.getElementById('pinInput').value = '';
            document.getElementById('pinError').textContent = '';
            pinOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => document.getElementById('pinInput').focus(), 300);
        }

        function closePin() {
            pinOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function submitPin() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin === ADMIN_PIN) {
                setSession(true);
                closePin();
                showToast('Login berhasil. Selamat datang Admin! ✓');
            } else {
                document.getElementById('pinError').textContent = 'PIN salah. Coba lagi.';
                document.getElementById('pinInput').value = '';
                document.getElementById('pinInput').focus();
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        function bindEvents() {
            document.getElementById('closeModal').addEventListener('click', closeModalFunc);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModalFunc();
            });

            document.getElementById('editPrayerBtn').addEventListener('click', () => {
                const prayer = prayersData.find(p => p.id === currentDetailId);
                if (prayer) {
                    closeModalFunc();
                    setTimeout(() => openForm(prayer), 250);
                }
            });

            document.getElementById('deletePrayerBtn').addEventListener('click', () => {
                if (!currentDetailId) return;
                if (confirm('Yakin ingin menghapus do\'a ini?')) {
                    prayersData = prayersData.filter(p => p.id !== currentDetailId);
                    saveData();
                    closeModalFunc();
                    renderCategories();
                    renderPrayers();
                    showToast('Do\'a berhasil dihapus ✓');
                }
            });

            document.getElementById('closeForm').addEventListener('click', closeForm);
            document.getElementById('cancelForm').addEventListener('click', closeForm);
            document.getElementById('saveForm').addEventListener('click', saveForm);
            formOverlay.addEventListener('click', (e) => {
                if (e.target === formOverlay) closeForm();
            });

            document.getElementById('closePin').addEventListener('click', closePin);
            document.getElementById('submitPin').addEventListener('click', submitPin);
            document.getElementById('pinInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitPin();
            });
            pinOverlay.addEventListener('click', (e) => {
                if (e.target === pinOverlay) closePin();
            });

            document.getElementById('loginBtn').addEventListener('click', openPin);
            document.getElementById('addBtn').addEventListener('click', () => openForm());
            document.getElementById('logoutBtn').addEventListener('click', () => {
                setSession(false);
                showToast('Logout berhasil');
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderPrayers();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('active')) closeModalFunc();
                    if (formOverlay.classList.contains('active')) closeForm();
                    if (pinOverlay.classList.contains('active')) closePin();
                }
            });
        }

        // ============================================================
        // WEBGL BACKGROUND
        // ============================================================
        function initWebGL() {
            const canvas = document.getElementById('bg-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 600;
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 80;
                positions[i + 1] = (Math.random() - 0.5) * 80;
                positions[i + 2] = (Math.random() - 0.5) * 80;

                colors[i] = 0.85 + Math.random() * 0.15;
                colors[i + 1] = 0.7 + Math.random() * 0.3;
                colors[i + 2] = 0.2 + Math.random() * 0.3;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            const particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);

            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.0005;
                particles.rotation.y = time * 0.5;
                particles.rotation.x = Math.sin(time * 0.3) * 0.1;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            initWebGL();
            loadData();
            checkSession();
            bindEvents();
            renderCategories();
            renderPrayers();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
